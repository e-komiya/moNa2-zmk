name: Build keyboards
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      raw_gpio:
        description: Build standalone right moNa2 raw GPIO diagnostic only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  raw-gpio:
    if: inputs.raw_gpio == true
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Zephyr workspace
        run: |
          west init -m https://github.com/zmkfirmware/zephyr --mr dacab4875df72109b96cc8977547a0dc04875bcd /tmp/raw-build
          cd /tmp/raw-build
          west update hal_nordic cmsis tinycrypt --fetch-opt=--filter=tree:0
          west zephyr-export
      - name: Build standalone GPIO diagnostic
        run: |
          cd /tmp/raw-build
          west build -s "$GITHUB_WORKSPACE/diagnostics/raw-gpio" -d build -b seeeduino_xiao_ble
          mkdir -p /tmp/raw-artifact
          cp build/zephyr/zephyr.uf2 /tmp/raw-artifact/mona2-right-raw-gpio-v1.uf2
          cp build/zephyr/.config /tmp/raw-artifact/build.config
          cp build/zephyr/zephyr.dts /tmp/raw-artifact/build-zephyr.dts
          cp build/zephyr/zephyr.elf /tmp/raw-artifact/firmware.elf
          west manifest --freeze > /tmp/raw-artifact/west-frozen.yml
          sha256sum /tmp/raw-artifact/*.uf2 > /tmp/raw-artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mona2-right-raw-gpio-v1
          path: /tmp/raw-artifact/
          if-no-files-found: error
  build:
    if: inputs.raw_gpio != true
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - {keyboard: mona2, shield: "mona2_r rgbled_adapter", artifact: mona2-right, snippet: studio-rpc-usb-uart}
          - {keyboard: mona2, shield: "mona2_r rgbled_adapter", artifact: mona2-right-diagnostic, snippet: zmk-usb-logging, diagnostic: true}
          - {keyboard: mona2, shield: "mona2_l rgbled_adapter", artifact: mona2-left}
          - {keyboard: microball, shield: microball_R, artifact: microball-right, snippet: studio-rpc-usb-uart}
          - {keyboard: microball, shield: microball_L, artifact: microball-left}
          - {keyboard: mona2, shield: settings_reset, artifact: settings-reset}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare keyboard workspace
        shell: bash
        env:
          KEYBOARD: ${{ matrix.keyboard }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/keyboard-build/config
          if [ "$KEYBOARD" = microball ]; then
            cp -R keyboards/microball /tmp/keyboard-module
            cp -R keyboards/microball/config/. /tmp/keyboard-build/config/
            cp config/microball.keymap /tmp/keyboard-build/config/
          else
            mkdir -p /tmp/keyboard-module
            cp -R boards zephyr /tmp/keyboard-module/
            cp config/west.yml config/mona2* /tmp/keyboard-build/config/
          fi
          if [ "${{ matrix.diagnostic || false }}" = "true" ]; then
            cp config/mona2_diag.keymap /tmp/keyboard-build/config/mona2.keymap
            cp config/mona2_diag.conf /tmp/keyboard-build/config/mona2_r.conf
          fi
      - name: Fetch dependencies
        working-directory: /tmp/keyboard-build
        run: |
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
      - name: Build
        working-directory: /tmp/keyboard-build
        shell: bash
        env:
          SHIELD: ${{ matrix.shield }}
          SNIPPET: ${{ matrix.snippet }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$SNIPPET" ]; then args+=(-S "$SNIPPET"); fi
          west build -s zmk/app -d build -b seeeduino_xiao_ble "${args[@]}" -- -DZMK_CONFIG=/tmp/keyboard-build/config "-DSHIELD=$SHIELD" -DZMK_EXTRA_MODULES=/tmp/keyboard-module
      - name: Collect firmware
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mkdir -p /tmp/firmware
          cp /tmp/keyboard-build/build/zephyr/zmk.uf2 "/tmp/firmware/$ARTIFACT.uf2"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.artifact }}
          path: /tmp/firmware/*.uf2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.artifact }}
          include-hidden-files: true
          path: |
            /tmp/keyboard-build/build/zephyr/.config
            /tmp/keyboard-build/build/zephyr/zephyr.dts
            /tmp/keyboard-build/build/zephyr/zephyr.dts.pre
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: firmware
          pattern: firmware-*
          delete-merged: true
